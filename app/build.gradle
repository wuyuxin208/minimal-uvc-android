plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.minimaluvc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.minimaluvc'
        minSdk 23
        // 面向可安装 APK 的老鸿蒙平板侧载；不是鸿蒙系统版本号。
        // 不要直接提升 targetSdk：旧 UVC 库需另做新 Android 行为适配。
        targetSdk 28
        versionCode 8
        versionName '1.3.2'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }
    lint {
        // 本工程按需求使用 target 28 在老鸿蒙上侧载，不提交 Google Play。
        // 只关闭 Play 上架目标版本检查，其他错误仍必须通过。
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // 使用上游仓库随附的已编译 AAR，避免依赖失效的 JitPack 3.3.3 构建。
    // 来源、固定提交及 SHA-256 记录于 third_party/README.md。
    implementation files('libs/libuvc-3.2.9.aar', 'libs/libuvccommon-3.2.9.aar')
    // 本地 AAR 不带 Maven 传递依赖，必须显式引入其运行时依赖。
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'com.elvishew:xlog:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.11.1') {
        // 本地只测试 Intent / 传统 Android View，不执行 Robolectric 的 Native 图形后端。
        exclude group: 'org.robolectric', module: 'nativeruntime-dist-compat'
    }
}
